- id: configulator-markdown
  name: configulator markdown
  description: Render the config reference table into a Markdown file between configulator markers.
  entry: scripts/pre-commit-configulator.sh --markdown
  language: script
  pass_filenames: false
  files: '\.(rs|md)$'
- id: configulator-sample
  name: configulator sample
  description: Write a sample config file, such as config.example.yaml.
  entry: scripts/pre-commit-configulator.sh --sample
  language: script
  pass_filenames: false
  files: '\.(rs|ya?ml)$'
