[package]
name = "configulator-cli"
version = "0.2.3"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Emit JSON Schema and sample configs for configulator-rs #[derive(Config)] structs"
repository = "https://github.com/USA-RedDragon/configulator-rs"
categories = ["config", "command-line-utilities"]
keywords = ["config", "configuration", "schema", "cli"]
readme = "README.md"
exclude = [".github/", "target/"]

[[bin]]
name = "configulator"
path = "src/main.rs"

[dependencies]
configulator-rs = { version = "0.2.3", path = "../configulator", default-features = false }
clap = { version = "4", features = ["derive"] }
syn = { version = "2", features = ["full", "extra-traits"] }
serde = "1"
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
