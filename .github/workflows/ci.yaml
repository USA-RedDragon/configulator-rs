name: ci

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  test:
    name: Test ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux Targets ---
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm

          # --- Windows Targets ---
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm

          # --- macOS Targets ---
          - target: x86_64-apple-darwin
            os: macos-26
          - target: aarch64-apple-darwin
            os: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Test
        run: |
          rustup target add ${{ matrix.target }}
          cargo test --all --target ${{ matrix.target }} --release

  checks:
    name: Clippy, features, trybuild
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Clippy
        run: cargo clippy --workspace --features testing --all-targets -- -D warnings
      - name: Feature matrix
        run: |
          set -e
          for features in \
            "" \
            "--no-default-features --features env" \
            "--no-default-features --features file" \
            "--no-default-features --features cli" \
            "--no-default-features --features file,env" \
            "--no-default-features --features file,cli" \
            "--no-default-features --features testing"; do
            echo "::group::cargo build $features"
            cargo build -p configulator-rs $features
            echo "::endgroup::"
          done
      - name: Trybuild UI tests
        run: cargo test --features testing --test ui

  msrv:
    name: MSRV (1.85, both crates)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check with MSRV toolchain
        run: |
          rustup toolchain install 1.85 --profile minimal
          cargo +1.85 check -p configulator-derive
          cargo +1.85 check -p configulator-rs --all-features
          cargo +1.85 check -p configulator-cli

  corpus:
    name: Conformance corpus (shared SPEC)
    runs-on: ubuntu-24.04
    env:
      # The SPEC version this release is pinned to. Bumping it requires
      # both repos green against the new corpus.
      EXPECTED_SPEC_VERSION: 0.1.2
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Checkout configulator (SPEC owner)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: USA-RedDragon/configulator
          path: spec-repo
      - name: Verify SPEC pin
        run: |
          actual=$(cat spec-repo/spec/SPEC_VERSION)
          if [ "$actual" != "$EXPECTED_SPEC_VERSION" ]; then
            echo "::error::SPEC_VERSION is $actual, this release is pinned to $EXPECTED_SPEC_VERSION"
            exit 1
          fi
      - name: Run corpus
        run: |
          CONFIGULATOR_SPEC_DIR="$PWD/spec-repo/spec" \
            cargo test --features testing --test corpus -- --nocapture

  docs:
    name: Build docs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build docs
        run: |
          rustup toolchain add nightly
          RUSTDOCFLAGS="--cfg docsrs -D warnings" cargo +nightly doc --no-deps --features file,cli,env

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --component llvm-tools-preview
          rustup default nightly
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage
        run: cargo llvm-cov --lcov --output-path lcov.info -- --skip ui
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  test-results:
    if: always()
    needs: [ test, coverage, checks, msrv, corpus ]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          results=("${{ needs.test.result }}" "${{ needs.coverage.result }}" "${{ needs.checks.result }}" "${{ needs.msrv.result }}" "${{ needs.corpus.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "One or more jobs failed" >&2
              exit 1
            fi
          done
          echo "All tests passed"

  publish:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docs, test-results]
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Get OIDC token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: oidc
        with:
          script: |
            const idToken = await core.getIDToken('crates.io');
            core.setOutput('id-token', idToken);
      - name: Exchange for crates.io publish token
        run: |
          set -o pipefail
          CRATES_IO_TOKEN=$(curl -sS -f -X POST \
            https://crates.io/api/v1/trusted_publishing/tokens \
            -H "Content-Type: application/json" \
            -H 'User-Agent: configulator-rs CI (github.com/USA-RedDragon/configulator-rs)' \
            -d "{\"jwt\": \"$IDTOKEN\"}" \
            | jq -r '.token')
          if [ -z "$CRATES_IO_TOKEN" ] || [ "$CRATES_IO_TOKEN" = "null" ]; then
            echo "::error::Failed to obtain crates.io publish token"
            exit 1
          fi
          echo "::add-mask::$CRATES_IO_TOKEN"
          echo "CRATES_IO_TOKEN=$CRATES_IO_TOKEN" >> "$GITHUB_ENV"
        env:
          IDTOKEN: ${{ steps.oidc.outputs.id-token }}
      - name: Publish workspace
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CRATES_IO_TOKEN }}
      - name: Attest configulator-derive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/package/tmp-crate/configulator-derive-*.crate
      - name: Attest configulator-rs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/package/tmp-crate/configulator-rs-*.crate
      - name: Attest configulator-cli
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/package/tmp-crate/configulator-cli-*.crate
