[package]
name = "configulator-rs"
version = "0.2.4"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "A configuration loader that populates a struct from config files, environment variables, and CLI flags"
repository = "https://github.com/USA-RedDragon/configulator-rs"
documentation = "https://docs.rs/configulator-rs"
categories = ["config"]
keywords = ["config", "configuration", "cli", "environment", "file"]
readme = "../README.md"
exclude = [".github/", "target/"]

[lib]
name = "configulator"

[features]
default = ["file", "cli", "env"]
file = ["dep:serde", "configulator-derive/file"]
cli = ["dep:clap", "configulator-derive/cli"]
env = ["configulator-derive/env"]
testing = ["cli"]
num-complex = ["dep:num-complex"]

[dependencies]
configulator-derive = { version = "0.2.4", path = "../configulator-derive", default-features = false }
clap = { version = "4", features = ["string"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
num-complex = { version = "0.4", default-features = false, optional = true }

[dev-dependencies]
configulator-rs = { path = ".", features = ["testing"] }
tempfile = "3"
serde = "1"
serde_yaml_ng = "0.10"
serde_json = "1"
clap = { version = "4", features = ["string"] }
trybuild = "1"

[[example]]
name = "basic"
required-features = ["file", "cli", "env"]

[[example]]
name = "advanced"
required-features = ["file", "cli", "env"]

[package.metadata.docs.rs]
features = ["file", "cli", "env"]
rustdoc-args = ["--cfg", "docsrs"]
